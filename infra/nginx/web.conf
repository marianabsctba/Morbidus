server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache via "expires" e não "add_header": um add_header dentro de location
    # faria o nginx ignorar os cabeçalhos de segurança definidos acima.

    # Arquivos com hash no nome podem ficar em cache por um ano.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rotas do React Router caem no index.html, que nunca fica em cache.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
